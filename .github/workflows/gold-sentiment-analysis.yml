name: Gold Sentiment Analysis

on:
  # Scheduled runs at specific GMT times (Monday-Friday only)
  # GitHub Actions uses UTC which is the same as GMT
  # Cron format: minute hour day month day-of-week (0-6, 0=Sunday, 6=Saturday)
  schedule:
    # Morning session (5:00 AM - 7:00 AM GMT) - Monday to Friday
    - cron: '0 5 * * 1-5'    # 5:00 AM GMT
    - cron: '30 5 * * 1-5'   # 5:30 AM GMT
    - cron: '0 6 * * 1-5'    # 6:00 AM GMT
    - cron: '30 6 * * 1-5'   # 6:30 AM GMT
    - cron: '0 7 * * 1-5'    # 7:00 AM GMT

    # Afternoon session (12:30 PM - 2:00 PM GMT) - Monday to Friday
    - cron: '30 12 * * 1-5'  # 12:30 PM GMT
    - cron: '0 13 * * 1-5'   # 1:00 PM GMT
    - cron: '30 13 * * 1-5'  # 1:30 PM GMT
    - cron: '0 14 * * 1-5'   # 2:00 PM GMT

    # Evening session (6:00 PM - 9:00 PM GMT) - Monday to Friday
    - cron: '0 18 * * 1-5'   # 6:00 PM GMT
    - cron: '30 18 * * 1-5'  # 6:30 PM GMT
    - cron: '0 19 * * 1-5'   # 7:00 PM GMT
    - cron: '0 20 * * 1-5'   # 8:00 PM GMT
    - cron: '30 20 * * 1-5'  # 8:30 PM GMT
    - cron: '0 21 * * 1-5'   # 9:00 PM GMT

  # Allow manual trigger
  workflow_dispatch:

jobs:
  analyze-gold-sentiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Gold Sentiment Analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DEFAULT_CHANNEL: ${{ secrets.SLACK_DEFAULT_CHANNEL }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          echo "🥇 Running Gold Sentiment Analysis at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          python -m src.nix_trader_ai.agents.gold_sentiment_agent

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
